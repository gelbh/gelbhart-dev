name: Setup gelbhart-dev app
description: Ruby, Node, bundle, npm for CI jobs
runs:
  using: composite
  steps:
    - name: Ensure bin stubs are executable
      shell: bash
      # Repo tracks bin/* as 100644; CI needs +x for bin/rails, bin/rubocop, etc.
      run: chmod +x bin/*
    - uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde # v1.307.0
      with:
        ruby-version: "3.3.10"
        # Hosted Ruby 3.3.10 default error_highlight 0.6.0 vs Gemfile 0.7.0;
        # need current RubyGems+Bundler before bundle install/runtime.
        rubygems: latest
        bundler: latest
        bundler-cache: true
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: ".node-version"
        cache: npm
    - name: Install npm dependencies
      shell: bash
      run: npm ci
