name: Setup gelbhart-dev app
description: Ruby, Node, bundle, npm for CI jobs
runs:
  using: composite
  steps:
    - name: Ensure bin stubs are executable
      shell: bash
      # Repo tracks bin/* as 100644; CI needs +x for bin/rails, bin/rubocop, etc.
      run: chmod +x bin/*
    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: "3.3.10"
        # Hosted Ruby 3.3.10 default error_highlight 0.6.0 vs Gemfile 0.7.0;
        # need current RubyGems+Bundler before bundle install/runtime.
        rubygems: latest
        bundler: latest
        bundler-cache: true
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ".node-version"
        cache: npm
    - name: Install npm dependencies
      shell: bash
      run: npm ci
